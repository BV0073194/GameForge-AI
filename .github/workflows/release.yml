name: Build Single-File Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: GameForgeAI-Windows-x64.exe
          - os: ubuntu-24.04
            artifact: GameForgeAI-Linux-x64
          - os: ubuntu-24.04-arm
            artifact: GameForgeAI-Linux-arm64
          - os: macos-15-intel
            artifact: GameForgeAI-macOS-x64
          - os: macos-15
            artifact: GameForgeAI-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect GameForge source root
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f "$GITHUB_WORKSPACE/requirements.txt" ] && [ -f "$GITHUB_WORKSPACE/GameForgeAI.spec" ]; then
            echo "GAMEFORGE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/GameForgeAI/requirements.txt" ] && [ -f "$GITHUB_WORKSPACE/GameForgeAI/GameForgeAI.spec" ]; then
            echo "GAMEFORGE_ROOT=$GITHUB_WORKSPACE/GameForgeAI" >> "$GITHUB_ENV"
          else
            echo "Could not find GameForge source files."
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Environment diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          echo "GAMEFORGE_ROOT=$GAMEFORGE_ROOT"
          python --version
          python -m pip --version
          python - <<'PY'
          import platform, sys
          print("system=", platform.system())
          print("machine=", platform.machine())
          print("python=", sys.version)
          PY
          find "$GAMEFORGE_ROOT" -maxdepth 2 -type f | sort

      - name: Upgrade pip tooling
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python -m pip install --upgrade pip setuptools wheel

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python -m pip install -r requirements.txt

      - name: Install build dependency
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python -m pip install -r requirements-build.txt

      - name: Dependency import check
        shell: bash
        env:
          PYNPUT_BACKEND: dummy
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python - <<'PY'
          import cv2, mss, psutil, numpy
          print("cv2", cv2.__version__)
          print("mss", mss.__version__)
          print("psutil", psutil.__version__)
          print("numpy", numpy.__version__)
          import pynput
          print("pynput import OK")
          PY

      - name: Stamp build channel
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          git fetch origin main --depth=1 || true
          CHANNEL="${GITHUB_REF_NAME}"
          if git rev-parse --verify origin/main >/dev/null 2>&1 && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            CHANNEL="main"
          elif [[ "$GITHUB_REF_NAME" == experimental/* ]]; then
            CHANNEL="experimental"
          fi
          export CHANNEL
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("build_info.json").write_text(json.dumps({
              "channel": os.environ["CHANNEL"],
              "ref": os.environ.get("GITHUB_REF_NAME", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "workflow_ref": os.environ.get("GITHUB_REF", ""),
          }, indent=2), encoding="utf-8")
          print(Path("build_info.json").read_text())
          PY

      - name: Smoke test source
        shell: bash
        env:
          PYNPUT_BACKEND: dummy
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python tests/smoke.py

      - name: Build one-file executable
        shell: bash
        env:
          PYNPUT_BACKEND: dummy
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python -m PyInstaller --noconfirm --clean GameForgeAI.spec

      - name: Rename binary
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GAMEFORGE_ROOT"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          artifact = os.environ["ARTIFACT"]
          candidates = [Path("dist/GameForgeAI.exe"), Path("dist/GameForgeAI")]
          src = next((p for p in candidates if p.exists()), None)
          if src is None:
              raise SystemExit("Built executable not found")
          release_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "release"
          release_dir.mkdir(exist_ok=True)
          dst = release_dir / artifact
          shutil.copy2(src, dst)
          if os.name != "nt":
              dst.chmod(0o755)
          print(dst, dst.stat().st_size)
          PY
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - name: Smoke test frozen executable
        shell: bash
        env:
          PYNPUT_BACKEND: dummy
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os, pathlib, subprocess, time, urllib.request
          artifact = pathlib.Path("release") / os.environ["ARTIFACT"]
          p = subprocess.Popen(
              [str(artifact.resolve()), "--no-browser", "--port", "43219"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          ok = False
          try:
              for _ in range(60):
                  time.sleep(1)
                  if p.poll() is not None:
                      output = p.stdout.read() if p.stdout else ""
                      raise SystemExit(f"Executable exited early ({p.returncode}):\n{output}")
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:43219/api/status", timeout=2) as r:
                          if r.status == 200:
                              ok = True
                              break
                  except Exception:
                      pass
              if not ok:
                  output = p.stdout.read() if p.stdout else ""
                  raise SystemExit(f"Frozen executable did not become healthy:\n{output}")
          finally:
              p.terminate()
              try:
                  p.wait(timeout=10)
              except Exception:
                  p.kill()
          print("FROZEN_SMOKE_OK")
          PY

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact }}
