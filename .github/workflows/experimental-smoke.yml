name: GameForge Source Smoke

on:
  push:
    branches:
      - main
      - "experimental/**"
      - "fusion/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd GameForgeAI
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend
        shell: bash
        run: |
          set -euxo pipefail
          cd GameForgeAI
          python -m py_compile server/app.py server/codex_app_server.py server/acp_transport.py server/fusion_mcp.py server/wsl_cleanup.py server/iteration_state.py
          python -m unittest discover -s tests -p "test_codex_app_server.py" -v
          python -m unittest discover -s tests -p "test_fusion_protocols.py" -v
          python -m unittest discover -s tests -p "test_live_agent_accountability.py" -v
          python -m unittest discover -s tests -p "test_wsl_cleanup.py" -v
          node --check web/app.js

      - name: Run source smoke
        shell: bash
        env:
          PYNPUT_BACKEND: dummy
        run: |
          set -euxo pipefail
          cd GameForgeAI
          python tests/smoke.py


  windows-smoke:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-Location GameForgeAI
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend
        shell: pwsh
        run: |
          Set-Location GameForgeAI
          python -m py_compile server/app.py server/codex_app_server.py server/acp_transport.py server/fusion_mcp.py server/wsl_cleanup.py server/iteration_state.py
          python -m unittest discover -s tests -p "test_codex_app_server.py" -v
          python -m unittest discover -s tests -p "test_fusion_protocols.py" -v
          python -m unittest discover -s tests -p "test_live_agent_accountability.py" -v
          python -m unittest discover -s tests -p "test_wsl_cleanup.py" -v
          node --check web/app.js

      - name: Run source smoke
        shell: pwsh
        env:
          PYNPUT_BACKEND: dummy
        run: |
          Set-Location GameForgeAI
          python tests/smoke.py
